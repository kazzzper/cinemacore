openapi: 3.1.0
info:
  title: Cinemacore API
  version: 0.1.0
  description: |
    Source of truth for the Cinemacore wire API. The Go server, Swift client,
    and Kotlin client are all generated from this document. Additive changes
    only within a major version (see rules/05-api-contract.md).
servers:
  - url: http://localhost:8080
    description: local
tags:
  - name: system
    description: Service health and build information.
  - name: browse
    description: "Browsing and discovery: landing rails, search and suggestions."
  - name: title
    description: Per-title detail, episode trees and playback resolution.
# Unauthenticated by design: this runs on localhost, and on the user's own
# gateway in the app. Declared explicitly so the contract says so rather
# than leaving the auth model undefined.
security: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /version:
    get:
      tags: [system]
      summary: Build version
      operationId: version
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string }
  /v1/home:
    get:
      tags: [browse]
      summary: Landing rails
      operationId: home
      responses:
        "200":
          description: Landing sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Page" }
        "502":
          $ref: "#/components/responses/Upstream"
  /v1/search:
    get:
      tags: [browse]
      summary: Search titles
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching subjects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Subject" }
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Upstream"
  /v1/detail/{id}:
    get:
      tags: [title]
      summary: One title's details
      operationId: detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
        "502":
          $ref: "#/components/responses/Upstream"
  /v1/detail/{id}/seasons:
    get:
      tags: [title]
      summary: Season and episode tree
      operationId: seasons
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Season and episode tree for a series
          content:
            application/json:
              schema:
                type: object
                required: [seasons]
                properties:
                  seasons:
                    type: array
                    items: { $ref: "#/components/schemas/Season" }
        "502":
          $ref: "#/components/responses/Upstream"
  /v1/play:
    get:
      tags: [title]
      summary: Resolve playback sources
      operationId: play
      description: |
        Resolved playback sources for one episode. A movie omits both season and
        episode, and the provider then answers with the movie stream.

        When the upstream offers only its anti-piracy decoy and no recovery path
        yields a real manifest, this answers 502 with code `stream_unavailable`
        instead of returning the decoy as playable content.
      parameters:
        - name: subjectId
          in: query
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: integer }
        - name: episode
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Streams and subtitle tracks for the requested subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Upstream"
  /v1/search/suggestions:
    get:
      tags: [browse]
      summary: Type-ahead suggestions
      operationId: searchSuggestions
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Type-ahead terms for the query
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Upstream"
components:
  responses:
    Error:
      description: Typed error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Upstream:
      description: Provider call failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Subject:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        poster: { type: string }
        year: { type: integer }
        rating: { type: number, format: double }
        kind: { type: string }
        synopsis: { type: string }
        genres:
          type: array
          items: { type: string }
        dubs:
          type: array
          items: { type: string }
        dubOptions:
          type: array
          items: { $ref: "#/components/schemas/Dub" }
        durationMinutes: { type: integer }
        seasonCount: { type: integer }
        cast:
          type: array
          items: { $ref: "#/components/schemas/CastMember" }
        resourceDetectors:
          type: array
          items: { $ref: "#/components/schemas/ResourceDetector" }
    Section:
      type: object
      required: [title, items]
      properties:
        title: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Subject" }
    Page:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/Section" }
    Episode:
      type: object
      required: [subjectId, season, number]
      properties:
        subjectId: { type: string }
        season: { type: integer }
        number: { type: integer }
        title: { type: string }
        durationSeconds:
          type: integer
          description: Upstream per-episode length; omitted when the resource listing has none.
    Quality:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
        size:
          type: string
          description: Upstream size in bytes for this rendition.
        cookie:
          type: string
          description: Media-request cookie (the gateway's signCookie); the only credential the CDN accepts.
        kind:
          type: string
          description: Per-rendition playback marker; see `StreamRendition.kind`.
          enum: [web]
    Stream:
      type: object
      required: [url]
      properties:
        url: { type: string }
        qualities:
          type: array
          items: { $ref: "#/components/schemas/Quality" }
        headers:
          type: object
          additionalProperties: { type: string }
        kind:
          type: string
          description: >-
            How the URL plays; the same marker `StreamRendition.kind` carries,
            before the stream is flattened into renditions.
          enum: [web]
    Subtitle:
      type: object
      required: [lang, url]
      properties:
        lang: { type: string }
        url: { type: string }
        format: { type: string }
    CastMember:
      type: object
      required: [name]
      properties:
        name: { type: string }
        role: { type: string }
        avatar: { type: string }
    Dub:
      type: object
      description: One selectable language version; playback re-resolves subjectId.
      required: [subjectId, languageName]
      properties:
        subjectId: { type: string }
        languageName: { type: string }
        languageCode: { type: string }
        isOriginal: { type: boolean }
    ResourceDetector:
      type: object
      description: One provider playable mirror/upload resource for a title.
      required: [resourceId, name]
      properties:
        resourceId: { type: string }
        name: { type: string }
    Season:
      type: object
      required: [number, episodes]
      properties:
        number: { type: integer }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
    StreamRendition:
      type: object
      required: [quality, url]
      properties:
        quality:
          type: string
          description: Provider label; the first entry is usually `Auto`.
        url: { type: string }
        size: { type: string }
        cookie: { type: string }
        kind:
          type: string
          description: >-
            How the URL plays. Empty (or absent) is direct media — an HLS
            manifest or progressive file a native player can open. `web` is a
            browser-rendered embed page: open it in a web view, never hand it
            to a native player or downloader.
          enum: [web]
    SubtitleTrack:
      type: object
      required: [language, url]
      properties:
        language: { type: string }
        url: { type: string }
        format:
          type: string
          description: Track format, `vtt` or `srt`.
    PlayInfo:
      type: object
      required: [streams, subtitles]
      properties:
        streams:
          type: array
          items: { $ref: "#/components/schemas/StreamRendition" }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/SubtitleTrack" }