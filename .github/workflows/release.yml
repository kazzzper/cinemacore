name: release

# Tag pushes cut a release. Branch, PR and manual runs verify the same macOS
# build without publishing, so the iOS artifact path is exercised by CI rather
# than by cutting a throwaway tag.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The unit-test gate. CinemacoreCore is pure Foundation precisely so its 443
  # tests run anywhere Swift does; Linux is where the project is developed, so
  # it is where the tests are authoritative and cheap (seconds, free minutes).
  # 24.04 is pinned for its preinstalled Swift 6.4 toolchain: 26.04 does not
  # ship one, and downloading a 3.5 GB toolchain per run buys nothing here.
  ios-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        working-directory: mobile/ios/CinemacoreCore
        run: swift test

  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches VERSION
        run: node scripts/version --check --tag "$GITHUB_REF_NAME"

  android:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install platform 37
        run: sdkmanager --install "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Derive release identity
        working-directory: .
        run: node scripts/version --env >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build artifacts
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify embedded Android version
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging mobile/android/app/build/outputs/apk/debug/app-debug.apk | head -1)
          CODE=$(printf '%s' "$BADGING" | sed -E "s/.*versionCode='([^']+)'.*/\1/")
          NAME=$(printf '%s' "$BADGING" | sed -E "s/.*versionName='([^']+)'.*/\1/")
          test "$CODE" = "$APP_BUILD_NUMBER" || { echo "versionCode $CODE != $APP_BUILD_NUMBER" >&2; exit 1; }
          test "$NAME" = "$APP_FULL_VERSION" || { echo "versionName $NAME != $APP_FULL_VERSION" >&2; exit 1; }
      - name: Collect
        run: |
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "release/Cinemacore-${APP_TAG}-debug.apk"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "release/Cinemacore-${APP_TAG}-release.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/*
          if-no-files-found: error

  ios:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    # Xcode 27 image: macOS 27, Xcode 27.1 by default, Swift 6.4, iOS 27 SDK.
    # arm64 only. Apple tooling only: no xtool, no brew installs.
    runs-on: xcode-27
    env:
      # Keep Xcode's output line-buffered so a failed step shows its last lines.
      NSUnbufferedIO: YES
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --find swift
          swift --version
          xcodebuild -showsdks | grep -E 'iOS|Simulator' | head -5
      # The slow Darwin lane, and the only place iOS-specific behaviour is
      # exercised: a simulator, the iOS SDK, the same `#if os(iOS)` code the
      # artifact ships. It runs on tags only because it costs macOS minutes per
      # run and cannot reproduce a logic failure the Linux gate would miss; the
      # per-push job below proves the project still compiles.
      - name: iOS unit tests
        run: IOS_RESULT_BUNDLE="$RUNNER_TEMP/ios-tests.xcresult" ./scripts/ios-test
      # A failed suite is only diagnosable with its bundle: xcodebuild's log
      # names failing assertions but not the file/line state around them.
      - name: Keep the test bundle if the suite failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-xcresult
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      # Same script as `make ios-release`; it verifies the embedded identity.
      - name: Build unsigned iOS artifacts
        run: ./scripts/ios-build
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: ${{ github.workspace }}/release/
          if-no-files-found: error

  # Every non-tag run proves the committed project still builds on the same
  # image the release uses. Nothing here publishes. No simulator test: the unit
  # tests already ran on Linux in `ios-core`, and a second macOS pass on every
  # push bought a slow, cloned red suite rather than a new signal.
  ios-verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: xcode-27
    env:
      NSUnbufferedIO: YES
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --find swift
          swift --version
      - name: Xcode project
        working-directory: mobile/ios/Cinemacore
        run: |
          xcodebuild -list -project Cinemacore.xcodeproj
          xcodebuild -showdestinations -project Cinemacore.xcodeproj -scheme Cinemacore | head -20
      - name: Build unsigned iOS artifacts
        run: ./scripts/ios-build
      - uses: actions/upload-artifact@v7
        with:
          name: ios-verify
          path: ${{ github.workspace }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    # `ios-core` is not tag-gated, so a red unit test blocks the release.
    needs: [android, ios, ios-core]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Derive release identity
        id: meta
        run: node scripts/version --github
      - name: Extract release notes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.APP_VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = changelog.indexOf(`## [${version}]`);
          if (start === -1) {
            fs.writeFileSync('release-notes.md', `Release ${version}`);
            process.exit(0);
          }
          const rest = changelog.slice(start);
          const next = rest.indexOf('\n## [', 1);
          fs.writeFileSync('release-notes.md', (next === -1 ? rest : rest.slice(0, next)).trim() + '\n');
          NODE
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: release/**/*
          fail_on_unmatched_files: true
