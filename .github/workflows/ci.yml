name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -cover
      - name: Build
        run: go build ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI
        # Pinned deliberately. `@latest` floated across Redocly majors and its
        # default ruleset changed under us, turning this job red with no change
        # to the contract. Bump it on purpose, not by accident.
        run: npx --yes @redocly/cli@2.64.1 lint contracts/openapi.yaml

  # android: requires JDK 17 + Android SDK (see tasks/T-006)
  # ios: requires macOS + Xcode 27 (see tasks/T-007)
